[workspace]
resolver = "2"
members = ["crates/solver", "crates/app"]

# Small, fast release builds (goal: program below 35 MB).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# A build without `--release` must also be usable: without optimization
# the calculation is many times slower.
[profile.dev]
opt-level = 2
